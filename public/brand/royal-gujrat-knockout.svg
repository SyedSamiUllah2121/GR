<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 84" width="180" height="84" role="img" aria-label="Royal Gujrat — Restaurant &amp; Sweets">
  <title>Royal Gujrat — Restaurant &amp; Sweets</title>

  <!--
       Knockout lockup, for the red rail. A white plate around the full-colour
       mark reads as a heavy card in a narrow column, so here the artwork is
       reversed out instead and sits straight on the rail.

       Tighter than the horizontal lockup on purpose: the emblem is smaller
       against the wordmark and the leading is closed up, so the block stays
       short enough to leave the rail to the navigation.

       #A81823 is the rail's own red. The cutlery keeps its outline where it
       crosses the white bowl by switching to that colour, and the crescents
       are cut the same way — change the rail colour and this file has to
       change with it.
  -->
  <defs>
    <clipPath id="rg-bowl">
      <path d="M18 92H222A102 63 0 0 1 18 92Z" transform="translate(58.4 4.6) scale(0.261)"/>
    </clipPath>
    <g id="rg-cutlery" fill="none" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
      <g transform="translate(20 8) rotate(-49) scale(1.29)">
        <path d="M-14 52V4a1.9 1.9 0 0 1 3.8 0v32h5.4V4a1.9 1.9 0 0 1 3.8 0v32h5.4V4a1.9 1.9 0 0 1 3.8 0v32h5.4V4a1.9 1.9 0 0 1 3.8 0v48c0 9-4.8 13.2-10 15V163a4 4 0 0 1-8 0V67c-5.2-1.8-10-6-10-15Z"/>
      </g>
      <g transform="translate(220 8) rotate(49) scale(1.29)">
        <path d="M0 3c5.8 11 8.6 27 8.6 45v20H4v95a4 4 0 0 1-8 0V68h-5.6V27C-9.6 14-4.6 6 0 3Z"/>
      </g>
    </g>
  </defs>

  <g transform="translate(58.4 4.6) scale(0.261)">
    <path d="M18 92H222A102 63 0 0 1 18 92Z" fill="#FFFFFF"/>
    <g fill="#A81823">
      <path d="M52 106Q84 88 114 111Q84 111 52 106Z"/>
      <path d="M118 106Q150 88 182 111Q150 111 118 106Z"/>
    </g>
    <use href="#rg-cutlery" stroke="#FFFFFF"/>
  </g>

  <g clip-path="url(#rg-bowl)" transform="translate(58.4 4.6) scale(0.261)">
    <use href="#rg-cutlery" stroke="#A81823"/>
  </g>

  <g transform="translate(58.4 4.6) scale(0.261)" fill="none" stroke="#F2C300" stroke-width="9" stroke-linecap="round">
    <path d="M104 76c-6.5-12 8.5-18.5 2-31-4.6-9 5.6-15 1-23"/>
    <path d="M122 74c-6.5-12 8.5-18.5 2-31-4.6-9 5.6-15 1-25"/>
    <path d="M140 76c-6.5-12 8.5-18.5 2-31-4.6-9 5.6-15 1-23"/>
  </g>

  <text x="90" y="65" text-anchor="middle" textLength="150" lengthAdjust="spacingAndGlyphs"
        font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800"
        fill="#FFFFFF">ROYAL GUJRAT</text>
  <text x="90" y="78" text-anchor="middle" textLength="142" lengthAdjust="spacing"
        font-family="Arial, Helvetica, sans-serif" font-size="6.6" font-weight="700"
        fill="#FFFFFF" fill-opacity="0.65">RESTAURANT &amp; SWEETS</text>
</svg>
