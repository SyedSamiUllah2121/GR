<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!--
       The browser-tab icon: the emblem from public/brand/royal-gujrat-emblem.svg
       on a tile of the rail's red, because the emblem is reversed out in white
       and would vanish on a light tab strip. Next serves this as /icon.svg and
       links it from every page. Keep it in step with the emblem if that changes.
  -->
  <defs>
    <clipPath id="rgi-bowl">
      <path d="M18 92H222A102 63 0 0 1 18 92Z" transform="translate(0 6)"/>
    </clipPath>
    <g id="rgi-cutlery" fill="none" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <g transform="translate(20 8) rotate(-49) scale(1.29)">
        <path d="M-14 52V4a1.9 1.9 0 0 1 3.8 0v32h5.4V4a1.9 1.9 0 0 1 3.8 0v32h5.4V4a1.9 1.9 0 0 1 3.8 0v32h5.4V4a1.9 1.9 0 0 1 3.8 0v48c0 9-4.8 13.2-10 15V163a4 4 0 0 1-8 0V67c-5.2-1.8-10-6-10-15Z"/>
      </g>
      <g transform="translate(220 8) rotate(49) scale(1.29)">
        <path d="M0 3c5.8 11 8.6 27 8.6 45v20H4v95a4 4 0 0 1-8 0V68h-5.6V27C-9.6 14-4.6 6 0 3Z"/>
      </g>
    </g>
  </defs>

  <rect width="240" height="240" rx="48" fill="#A81823"/>

  <g transform="translate(0 30)">
    <g transform="translate(0 6)">
      <path d="M18 92H222A102 63 0 0 1 18 92Z" fill="#FFFFFF"/>
      <g fill="#A81823">
        <path d="M52 106Q84 88 114 111Q84 111 52 106Z"/>
        <path d="M118 106Q150 88 182 111Q150 111 118 106Z"/>
      </g>
      <use href="#rgi-cutlery" stroke="#FFFFFF"/>
    </g>
    <g clip-path="url(#rgi-bowl)" transform="translate(0 6)">
      <use href="#rgi-cutlery" stroke="#A81823"/>
    </g>
    <g transform="translate(0 6)" fill="none" stroke="#F2C300" stroke-width="9" stroke-linecap="round">
      <path d="M104 76c-6.5-12 8.5-18.5 2-31-4.6-9 5.6-15 1-23"/>
      <path d="M122 74c-6.5-12 8.5-18.5 2-31-4.6-9 5.6-15 1-25"/>
      <path d="M140 76c-6.5-12 8.5-18.5 2-31-4.6-9 5.6-15 1-23"/>
    </g>
  </g>
</svg>
